name: Test de github actions
on: [push]
jobs:
  test-de-fonctionnement:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: run de npm install
        run: npm install
      - name: run de npm run build
        run: npm run build
      - name: run de npm start
        run: npm start
      - name: test de la route
        run: curl http://localhost:3000